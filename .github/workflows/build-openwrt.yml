name: OpenWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      upload_firmware:
        description: '上传固件 Artifact'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      upload_release:
        description: '上传到 GitHub Release'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  DOWNLOAD_THREADS: 16
  CCACHE_MAXSIZE: 5G

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 720

    steps:
      # ==================== 检出仓库 ====================
      - name: Checkout
        uses: actions/checkout@v5

      # ==================== 初始化环境 ====================
      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e

          echo "::group::清理磁盘空间"
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          sudo -E apt-get -qq update
          echo "::endgroup::"

          echo "::group::安装编译依赖"
          sudo -E apt-get -qq install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache cmake cpio curl \
            device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev \
            libpython3-dev libreadline-dev libssl-dev libtool lrzsz \
            mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf \
            python2.7 python3 python3-pyelftools python3-setuptools \
            qemu-utils rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          echo "::endgroup::"

          sudo -E apt-get -qq autoremove --purge -y
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

          # 创建 4GB swap 空间，防止编译时 OOM
          echo "::group::创建 swap 空间"
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          echo "::endgroup::"

          sudo mkdir -p /workdir
          sudo chown "$(whoami)":"$(id -gn)" /workdir

      # ==================== 克隆源码 ====================
      - name: Clone source code
        working-directory: /workdir
        run: |
          set -e

          echo "::group::显示磁盘信息"
          df -hT "$PWD"
          echo "::endgroup::"

          if [ -d openwrt/.git ]; then
            echo "源码已存在，执行更新..."
            cd openwrt
            git fetch --all
            git reset --hard origin/"$REPO_BRANCH"
            git clean -fd
          else
            echo "开始克隆源码..."
            git clone --depth 1 "$REPO_URL" -b "$REPO_BRANCH" openwrt
          fi

          ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

      # ==================== 缓存 ccache ====================
      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: openwrt/.ccache
          key: ccache-${{ env.REPO_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.REPO_BRANCH }}-
            ccache-

      # ==================== 缓存 dl 下载目录 ====================
      - name: Cache dl directory
        uses: actions/cache@v5
        with:
          path: openwrt/dl
          key: dl-${{ env.REPO_BRANCH }}-${{ hashFiles('.config') }}
          restore-keys: |
            dl-${{ env.REPO_BRANCH }}-
            dl-

      # ==================== 加载自定义 Feeds ====================
      - name: Load custom feeds
        run: |
          set -e

          if [ -f "$FEEDS_CONF" ]; then
            cp -f "$FEEDS_CONF" openwrt/feeds.conf.default
            echo "✅ 已加载 $FEEDS_CONF"
          else
            echo "未找到 $FEEDS_CONF，使用默认 feeds"
          fi

          if [ -f "$DIY_P1_SH" ]; then
            chmod +x "$DIY_P1_SH"
            cd openwrt
            bash "$GITHUB_WORKSPACE/$DIY_P1_SH"
            echo "✅ 已执行 $DIY_P1_SH"
          else
            echo "未找到 $DIY_P1_SH，跳过"
          fi

      # ==================== 更新并安装 Feeds ====================
      - name: Update & install feeds
        run: |
          set -e
          cd openwrt

          echo "::group::更新 feeds"
          ./scripts/feeds update -a
          echo "::endgroup::"

          echo "::group::安装 feeds"
          ./scripts/feeds install -a
          echo "::endgroup::"

      # ==================== 加载自定义配置 ====================
      - name: Load custom configuration
        run: |
          set -e

          # 复制自定义 files 目录（先删除再复制，避免嵌套）
          if [ -d files ]; then
            rm -rf openwrt/files
            cp -rf files openwrt/files
            echo "✅ 已复制 files 目录"
          else
            echo "未找到 files 目录，跳过"
          fi

          # 加载 .config 配置文件
          if [ -f "$CONFIG_FILE" ]; then
            cp -f "$CONFIG_FILE" openwrt/.config
            echo "✅ 已加载 $CONFIG_FILE"
          else
            echo "::error::未找到 $CONFIG_FILE，无法继续编译"
            exit 1
          fi

          # 启用 ccache 加速重编译
          cd openwrt
          sed -i '/^# CONFIG_CCACHE is not set/d' .config
          sed -i '/^CONFIG_CCACHE=/d' .config
          echo "CONFIG_CCACHE=y" >> .config
          echo "✅ 已启用 ccache"

          # 执行 DIY 第二阶段脚本
          if [ -f "$GITHUB_WORKSPACE/$DIY_P2_SH" ]; then
            chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"
            bash "$GITHUB_WORKSPACE/$DIY_P2_SH"
            echo "✅ 已执行 $DIY_P2_SH"
          else
            echo "未找到 $DIY_P2_SH，跳过"
          fi

      # ==================== 下载软件包 ====================
      - name: Download packages
        run: |
          set -e
          cd openwrt

          echo "::group::生成默认配置"
          make defconfig
          echo "::endgroup::"

          echo "::group::下载软件包（${DOWNLOAD_THREADS} 线程）"
          make download -j"$DOWNLOAD_THREADS"
          echo "::endgroup::"

          # 清理不完整下载
          find dl -size -1024c -type f -delete 2>/dev/null || true

      # ==================== 编译固件 ====================
      - name: Compile firmware
        id: compile
        run: |
          set -e
          cd openwrt

          # 配置 ccache
          export CCACHE_DIR="$PWD/.ccache"
          export CCACHE_MAXSIZE="${CCACHE_MAXSIZE}"
          mkdir -p "$CCACHE_DIR"
          ccache -M "$CCACHE_MAXSIZE" 2>/dev/null || true
          ccache -z 2>/dev/null || true

          NPROC=$(nproc)
          echo "使用 ${NPROC} 线程编译，ccache 缓存目录: ${CCACHE_DIR}"

          echo "::group::编译开始"
          if make -j"$NPROC" 2>&1; then
            echo "✅ 编译成功"
          elif make -j1 2>&1; then
            echo "✅ 单线程重试编译成功"
          elif make -j1 V=s 2>&1; then
            echo "✅ 详细模式编译成功"
          else
            echo "::error::编译失败"
            exit 1
          fi
          echo "::endgroup::"

          # 显示 ccache 统计
          echo "::group::ccache 统计"
          ccache -s 2>/dev/null || true
          echo "::endgroup::"

          echo "status=success" >> "$GITHUB_OUTPUT"

          # 提取设备名
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config \
            | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME || true

          if [ -s DEVICE_NAME ]; then
            echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
          fi

          echo "FILE_DATE=_$(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      # ==================== 磁盘空间检查 ====================
      - name: Check space usage
        if: always()
        run: |
          echo "::group::磁盘空间使用"
          df -hT
          echo "::endgroup::"

          echo "::group::编译产物大小"
          du -sh openwrt/bin/targets/*/*/ 2>/dev/null || true
          echo "::endgroup::"

      # ==================== 上传完整 bin 目录 ====================
      - name: Upload bin directory
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin
          retention-days: 7
          compression-level: 6

      # ==================== 整理固件文件 ====================
      - name: Organize firmware files
        id: organize
        if: steps.compile.outputs.status == 'success'
        run: |
          set -e

          FIRMWARE_DIR=$(find openwrt/bin/targets -mindepth 2 -maxdepth 2 -type d | head -n 1)

          if [ -z "$FIRMWARE_DIR" ] || [ ! -d "$FIRMWARE_DIR" ]; then
            echo "::error::未找到固件目录"
            exit 1
          fi

          # 删除 packages 子目录，只保留固件
          rm -rf "${FIRMWARE_DIR}"/packages

          echo "FIRMWARE=$FIRMWARE_DIR" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"

          echo "::group::固件列表"
          ls -lh "$FIRMWARE_DIR"
          echo "::endgroup::"

      # ==================== 上传固件 Artifact ====================
      - name: Upload firmware artifact
        if: steps.organize.outputs.status == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}
          retention-days: 30
          compression-level: 6

      # ==================== 生成 Release 标签 ====================
      - name: Generate release tag
        id: tag
        if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
        run: |
          set -e

          RELEASE_TAG="OpenWrt-$(date +%Y.%m.%d-%H%M)"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          # 生成 Release 说明
          cat > release.txt <<EOF
          ## OpenWrt Lean 编译固件

          **编译时间:** $(date '+%Y-%m-%d %H:%M:%S %Z')
          **设备:** $(grep '^CONFIG_TARGET.*DEVICE.*=y' openwrt/.config | sed 's/.*DEVICE_\(.*\)=y/\1/' || echo 'Unknown')
          **源码:** ${REPO_URL} @ ${REPO_BRANCH}

          ---

          > 本固件由 GitHub Actions 自动编译生成
          EOF

          echo "status=success" >> "$GITHUB_OUTPUT"

      # ==================== 上传到 GitHub Release ====================
      - name: Upload to GitHub Release
        if: steps.tag.outputs.status == 'success'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*
          make_latest: true

      # ==================== 清理旧 Workflow 运行记录 ====================
      - name: Delete old workflow runs
        if: always()
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 7
          keep_minimum_runs: 5

      # ==================== 清理旧 Releases（使用 gh CLI） ====================
      - name: Remove old releases
        if: env.UPLOAD_RELEASE == 'true' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          KEEP=3

          echo "::group::清理旧 Releases"
          # 列出所有 Release，按创建时间升序排列
          mapfile -t releases < <(gh release list --limit 100 --json tagName,createdAt -q '.[] | "\(.createdAt) \(.tagName)"' | sort)

          TOTAL=${#releases[@]}
          echo "当前共有 ${TOTAL} 个 Release，保留最新 ${KEEP} 个"

          if [ "$TOTAL" -le "$KEEP" ]; then
            echo "Release 数量未超过保留数，跳过清理"
          else
            # 删除除最新 KEEP 个之外的旧 Release（不删除 Git 标签）
            for ((i=0; i<TOTAL-KEEP; i++)); do
              tag=$(echo "${releases[$i]}" | awk '{print $2}')
              [ -z "$tag" ] && continue
              echo "删除 Release: $tag"
              gh release delete "$tag" --yes 2>/dev/null || echo "⚠️ 删除失败: $tag"
            done
          fi
          echo "::endgroup::"

      # ==================== 编译失败通知 ====================
      - name: Notification on failure
        if: failure()
        run: |
          echo "::error::OpenWrt 编译失败！"
          echo "::error::请检查上方日志排查问题。"
          echo "::error::常见原因："
          echo "::error::  1. 配置文件选择的目标设备有误"
          echo "::error::  2. 依赖包下载不完整"
          echo "::error::  3. 源码更新导致配置不兼容"
